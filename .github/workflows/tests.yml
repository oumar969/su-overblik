name: Tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python verify_web.py
      - run: node --check web/dist/app.js
      - run: node --check web/dist/features.js
      - run: node --check web/dist/calculator.js
