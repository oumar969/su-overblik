name: Tests and Docker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python verify_web.py
      - name: Check all browser JavaScript
        run: |
          for file in web/dist/*.js; do node --check "$file"; done
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build container
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Start and wait for healthy container
        run: docker compose up -d --wait --wait-timeout 60
      - name: Verify actual served files and missing-page response
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8080/healthz | grep -Fx ok
          for file in index.html calculator.js app.js features.js interface.js chart-guide.js ml-model.js style.css guide.png; do
            curl --fail --silent "http://127.0.0.1:8080/$file" -o /tmp/served-file
            cmp "web/dist/$file" /tmp/served-file
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing-file)" = 404
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
