name: ML experiment
on:
  workflow_dispatch:
  push:
    paths: ['web/ml/**', '.github/workflows/ml.yml']
  pull_request:
    paths: ['web/ml/**', '.github/workflows/ml.yml']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/ml/requirements-tracking.txt
      - run: python -m pip install -r web/ml/requirements-tracking.txt
      - run: python web/ml/track_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-experiment-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 30
